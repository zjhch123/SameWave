name: SameWave
options:
  bundleIdPrefix: com.plus.samewave
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

targets:
  SameWave:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources
        excludes:
          - "Resources/SameWave.entitlements"
    entitlements:
      path: Sources/Resources/SameWave.entitlements
      properties:
        # Hardened Runtime is on (ENABLE_HARDENED_RUNTIME below). Microphone access
        # via AVFoundation REQUIRES this entitlement — without it the system denies
        # requestAccess silently (no prompt). Declared here so xcodegen regenerates
        # it into the entitlements file every time (a bare path would wipe it).
        com.apple.security.device.audio-input: true
    info:
      path: Sources/Resources/Info.plist
      properties:
        CFBundleName: SameWave
        CFBundleDisplayName: SameWave
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en]
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "26.0"
        # Regular app: shows a Dock icon and a main window.
        LSUIElement: false
        CFBundleIconName: AppIcon
        NSAudioCaptureUsageDescription: "SameWave taps the audio of your meeting app to transcribe and translate it on-device."
        NSMicrophoneUsageDescription: "Used only if you choose to caption your own microphone."
        NSSpeechRecognitionUsageDescription: "SameWave uses on-device speech recognition to transcribe meeting audio."
        # App Transport Security: allow cleartext HTTP ONLY to local/loopback hosts
        # (127.0.0.1, localhost, *.local, private IPs) so a user can point the insight
        # provider at a self-hosted OpenAI-compatible server. External domains still
        # require HTTPS — this is the minimal exception, not a blanket NSAllowsArbitraryLoads.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.plus.samewave
        # The app, executable, Swift module, target, and scheme share the English name.
        PRODUCT_NAME: "SameWave"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        CODE_SIGN_STYLE: Automatic
        # Local dev signing; process taps run fine with a dev signature.
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        # Non-sandboxed for the MVP so Core Audio process taps + model download are unhindered.
        ENABLE_APP_SANDBOX: NO
        SWIFT_STRICT_CONCURRENCY: complete
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.productivity"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  SameWaveTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Tests
    dependencies:
      - target: SameWave
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.plus.samewave.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SameWave.app/Contents/MacOS/SameWave"
        BUNDLE_LOADER: "$(TEST_HOST)"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete

schemes:
  SameWave:
    build:
      targets:
        SameWave: all
        SameWaveTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SameWaveTests
